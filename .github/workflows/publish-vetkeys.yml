name: Publish haven-aol-vetkeys to PyPI

on:
  push:
    tags:
      - "vetkeys-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI (uncheck for dry-run)"
        type: boolean
        required: false
        default: false

jobs:
  # ── Build native wheels on each platform ─────────────────────────
  build-wheels:
    name: Build wheels (${{ matrix.os }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            target: x86_64
            manylinux: manylinux2014
          - os: ubuntu-latest
            target: aarch64
            manylinux: manylinux2014
          # macOS
          - os: macos-13
            target: x86_64
          - os: macos-14
            target: aarch64
          # Windows
          - os: windows-latest
            target: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}-unknown-linux-gnu

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --strip --manifest-path packages/python/rust_ext/Cargo.toml
          # Produces one wheel per Python version (3.10–3.13)

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: target/wheels/*.whl

  # ── Publish to PyPI ──────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.publish
    environment:
      name: pypi-vetkeys
      url: https://pypi.org/p/haven-aol-vetkeys
    permissions:
      id-token: write   # Required for trusted publishing (OIDC)

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
